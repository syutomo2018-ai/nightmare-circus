<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>悪夢のサーカス</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: sans-serif;
}


/* ====================
   最初の画面
==================== */

#start {
    width: 100%;
    height: 100vh;

    background:
        radial-gradient(
            circle at center,
            #202020 0%,
            #050505 60%,
            #000 100%
        );

    color: white;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;
}

.circus {
    font-size: 60px;
    margin-bottom: 15px;
}

h1 {
    font-size: 42px;
    letter-spacing: 8px;
    margin: 10px;
}

.subtitle {
    color: #aaa;
    font-size: 15px;
    margin-bottom: 40px;
}

#enterButton {
    padding: 16px 45px;

    border: 1px solid white;
    background: transparent;
    color: white;

    font-size: 18px;
    cursor: pointer;

    transition: 0.3s;
}

#enterButton:hover {
    background: white;
    color: black;
}


/* ====================
   Loading
==================== */

#loading {
    display: none;

    width: 100%;
    height: 100vh;

    justify-content: center;
    align-items: center;

    background: black;
    color: white;

    font-size: 25px;
}


/* ====================
   ピエロ
==================== */

#jumpscare {
    display: none;

    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    background: black;

    z-index: 100;
}

#jumpscare img {
    width: 100%;
    height: 100%;

    object-fit: cover;
}


/* ====================
   ピエロ表示時の揺れ
==================== */

.shake {
    animation: shake 0.08s infinite;
}

@keyframes shake {

    0% {
        transform: translate(0, 0);
    }

    25% {
        transform: translate(8px, -8px);
    }

    50% {
        transform: translate(-8px, 7px);
    }

    75% {
        transform: translate(7px, 8px);
    }

    100% {
        transform: translate(-7px, -7px);
    }
}


/* ====================
   最終画面
==================== */

#final {
    display: none;

    width: 100%;
    height: 100vh;

    background:
        radial-gradient(
            circle at center,
            #1a1a1a,
            #000 75%
        );

    color: white;

    text-align: center;

    flex-direction: column;
    justify-content: center;
    align-items: center;
}

#final h2 {
    font-size: 42px;
    letter-spacing: 6px;
    margin-bottom: 25px;
}

.wait {
    font-size: 25px;
    margin: 15px;
}

.question {
    color: #aaa;
    margin-bottom: 35px;
}


/* ====================
   Instagram
==================== */

.instagram {
    display: inline-block;

    padding: 14px 30px;

    border: 1px solid white;

    color: white;
    text-decoration: none;

    font-size: 16px;

    transition: 0.3s;
}

.instagram:hover {
    background: white;
    color: black;
}


/* ====================
   スマホ用
==================== */

@media (max-width: 600px) {

    h1 {
        font-size: 32px;
        letter-spacing: 5px;
    }

    .circus {
        font-size: 50px;
    }

    #final h2 {
        font-size: 30px;
    }

    .wait {
        font-size: 22px;
    }

}

</style>
</head>


<body>


<!-- ====================
     最初の画面
==================== -->

<div id="start">

    <div class="circus">🎪</div>

    <h1>悪夢のサーカス</h1>

    <div class="subtitle">
        もうすぐ開演します。
    </div>

    <button id="enterButton">
        入場する
    </button>

</div>


<!-- ====================
     Loading
==================== -->

<div id="loading">
    Loading...
</div>


<!-- ====================
     ジャンプスケア
==================== -->

<div id="jumpscare">

    <img src="clown_jumpscare.png" alt="ピエロ">

</div>


<!-- ====================
     最終画面
==================== -->

<div id="final">

    <div class="circus">🎪</div>

    <h2>悪夢のサーカス</h2>

    <div class="wait">
        サーカスで待ってる。
    </div>

    <div class="question">
        あなたは最後まで耐えられる？
    </div>


    <a
        class="instagram"
        href="https://instagram.com"
        target="_blank"
    >
        📷 Instagramを見る
    </a>

</div>



<script>

/* ====================
   ボタン
==================== */

const enterButton =
    document.getElementById("enterButton");


/* ====================
   各画面
==================== */

const start =
    document.getElementById("start");

const loading =
    document.getElementById("loading");

const jumpscare =
    document.getElementById("jumpscare");

const final =
    document.getElementById("final");


/* ====================
   音声設定
==================== */
const scream = new Audio("https://soundeffect-lab.info");


/* ====================
   入場ボタン
==================== */

enterButton.addEventListener("click", function() {

    /* 最初の画面を消す */
    start.style.display = "none";

    /* Loading表示 */
    loading.style.display = "flex";

    /* 
       【超重要：スマホの音ブロックを完全に解除する処理】
       ユーザーがタップした「この瞬間」に、音量1.0のままで一度再生を開始し、
       1ミリ秒後にすぐ一時停止させます。
       これにより、スマホ側に「安全なユーザー発信の音声」として完全に承認させます。
    */
    scream.play().then(function() {
        scream.pause();
        scream.currentTime = 0;
        console.log("スマホの音声アクティベート成功");
    }).catch(function(error) {
        console.log("アクティベートエラー:", error);
    });


    /*
       確実に2秒待つ（ローディング時間）
    */
    setTimeout(function() {

        /* Loadingを消す */
        loading.style.display = "none";


        /* ====================
           ピエロ登場
        ==================== */
        jumpscare.style.display = "block";
        jumpscare.classList.add("shake");


        /* ====================
           叫び声（ここで本再生スタート）
        ==================== */
        scream.currentTime = 0;
        scream.volume = 1.0;
        
        scream.play().catch(function(error) {
            console.log("本再生エラー:", error);
        });


        /*
           1.5秒間ピエロを表示
        */
        setTimeout(function() {

            /* ピエロを消す */
            jumpscare.classList.remove("shake");
            jumpscare.style.display = "none";

            /* ====================
               最終画面
            ==================== */
            final.style.display = "flex";

            // 最終画面になったら叫び声を止める
            scream.pause();

        }, 1500);


    }, 2000);

});

</script>

</body>
</html>
